apiVersion: v1
kind: Pod
metadata:
  name: "{{ .Release.Name }}-app-test"
  labels:
    components: "{{ .Values.app.components }}-app-test"
  annotations:
    "helm.sh/hook": test
    # Pod от предыдущего запуска будет удаляться, и при повторном запуске не возникнет конфликта имён.
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  containers:
    - name: curl
      image: curlimages/curl:8.21.0
      command: ['curl']
      args: ['-f', 'http://{{ .Values.app.name }}-clusterip:{{ .Values.app.port }}/']
  restartPolicy: Never