apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.app.name }}-deployment
spec:
  replicas: {{ .Values.app.replicas }}
  selector:
    matchLabels:
      # matchLabels должен совпадать с metadata.labels  
      components: {{ .Values.app.components }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 50%
      maxUnavailable: 10%
  template:
    # шаблон типа Pod, который нужно развернуть
    metadata:
      # name нужен для обращения через kubectl
      name: {{ .Values.app.name }}
      labels:
        # labels нужен для связи с NodePort
        components: {{ .Values.app.components }}
    spec:
      containers:
        - name: {{ .Values.app.name }}
          image: "{{ .Values.app.image }}:{{ .Values.app.version }}"
          ports:
            # открытый наружу порт контейнера
            - containerPort: {{ .Values.app.port }}
          env:
            - name: VITE_DOMAIN
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.app.name }}-config
                  key: VITE_DOMAIN
          # ограничения Pod по ресурсам
          resources:
            limits: {{ .Values.app.limits | toYaml | nindent 14  }}
