apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.ingress.name }}
  annotations:
    # Указывает NGINX Ingress Controller автоматически добавлять HTML-тег <base href="..."> в секцию <head> возвращаемого веб-приложением ответа.
    # Так все относительные пути внутри страницы будут корректно пересчитаны относительно этого нового базового URL.
    nginx.ingress.kubernetes.io/add-base-url: "true"
spec:
  ingressClassName: nginx
  rules:
  - host: {{ .Values.ingress.host }}
    http:
      paths:
        # Тип пути
      - pathType: Prefix
        # URL-путь 
        path: "/api"
        backend:
          service:
            # matadata.name необходимого сервиса
            name: {{ .Values.api.name }}-clusterip
            port:
              # Целевой порт сервиса
              number: {{ .Values.api.port }}
      - pathType: Prefix
        path: "/uploads"
        backend:
          service:
            name: {{ .Values.api.name }}-clusterip
            port:
              number: {{ .Values.api.port }}
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: {{ .Values.app.name }}-clusterip
            port: 
              number: {{ .Values.app.port }}
