apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.converter.name }}-deployment
spec:
  replicas: {{ .Values.converter.replicas }}
  selector:
    matchLabels:
      components: {{ .Values.converter.name }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 50%
      maxUnavailable: 10%
  template:
    metadata:
      name: {{ .Values.converter.name }}
      labels:
        components: {{ .Values.converter.name }}
    spec:
      containers:
        - name: {{ .Values.converter.name }}
          image: "{{ .Values.converter.image }}:{{ .Values.converter.version }}"
          ports:
            - containerPort: {{ .Values.converter.port }}
          env:
            {{- range .Values.api.envs }}
            {{- $data := dict "name" $.Values.api.name "env" . }}
            {{- include "env.template" $data | indent 12}}
            {{- end}}
          resources:
            limits: {{ .Values.converter.limits | toYaml | nindent 14  }}
          