apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.api.name }}-secret
type: Opaque
data:
  {{- with .Values.amqp }}  
  AMQP_EXCHANGE: {{ .exchange | b64enc }}
  AMQP_USER: {{ .user | b64enc }}
  AMQP_PASSWORD: {{ .password | b64enc }}
  AMQP_QUEUE: {{ .queue | b64enc }}
  AMQP_HOSTNAME: {{ printf "%s-clusterip" $.Values.rabbitmq.name | b64enc | quote }}
  {{- end }}