apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.api.name }}-deployment
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      # matchLabels должен совпадать с metadata.labels  
      components: {{ .Values.api.components }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 50%
      maxUnavailable: 10%
  template:
    metadata:
      name: {{ .Values.api.name }}
      labels:
        components: {{ .Values.api.components }}
    spec:
      containers:
        - name: {{ .Values.api.name }}
          image: "{{ .Values.api.image }}:{{ .Values.api.version }}"
          ports:
            # открытый наружу порт контейнера
            - containerPort: {{ .Values.api.port }}
          env:
            {{- range .Values.api.envs }}
            {{- $data := dict "name" $.Values.api.name "env" . }}
            {{- include "env.template" $data | indent 12}}
            {{- end}}
          livenessProbe:
            {{- include "liveprobe.template" .Values.api | indent 12 }}
          resources:
            limits: {{ .Values.app.limits | toYaml | nindent 14  }}
          volumeMounts:
            - name: {{ .Values.api.name }}-data
              mountPath: /opt/app/uploads
    volumes:
      - name: {{ .Values.api.name }}-data
        persistentVolumeClaim:
          claimName: {{ .Values.api.name }}-pvc